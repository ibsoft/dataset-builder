# Replace datasetbuilder.example.com; install a valid TLS certificate first.
# Only expose port 443 to clients. Docker listens on 127.0.0.1:8000.
server {
    listen 443 ssl http2;
    server_name datasetbuilder.example.com;
    ssl_certificate /etc/letsencrypt/live/datasetbuilder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datasetbuilder.example.com/privkey.pem;
    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }
}
